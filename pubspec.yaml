name: signspeak
description: ASL Sign Language to Text - ML Inference Backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # TFLite inference

  # Camera feed
  camera: ^0.10.5+9

  # Path utilities
  path_provider: ^2.1.2
  tflite_flutter: ^0.11.0
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_commons: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/labels.txt